[package]
name = "yhes-mls-evaluation"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
openmls_sqlite_storage = "=0.3.0"
mls-rs = "=0.57.1"
mls-rs-crypto-openssl = "=0.22.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "openmls-probe"
path = "src/openmls.rs"

[[bin]]
name = "mlsrs-probe"
path = "src/mlsrs.rs"

[[bin]]
name = "openmls-worker"
path = "src/worker.rs"

[[bin]]
name = "sqlite-provider-probe"
path = "src/sqlite_provider.rs"
