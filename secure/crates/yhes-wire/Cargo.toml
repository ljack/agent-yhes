[package]
name = "yhes-wire"
description = "Signed-event and registry verifier for the agent-yhes secure profile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
sha2.workspace = true
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std"] }

[lints.rust]
unsafe_code = "forbid"
