[package]
name = "yhes-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "yhes"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
yhes-core = { path = "../yhes-core" }
yhes-wire = { path = "../yhes-wire" }
yhes-actions = { path = "../yhes-actions" }
async-nats = { version = "=0.52.0", default-features = false, features = ["ring", "jetstream", "server_2_10"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
futures-util = "0.3"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std"] }
