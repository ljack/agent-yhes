[package]
name = "yhes-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
sha2.workspace = true
zeroize.workspace = true
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
openmls_sqlite_storage = "=0.3.0"
rusqlite = { version = "=0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hmac = "0.12"
fs2 = "0.4"
yhes-wire = { path = "../yhes-wire" }
yhes-actions = { path = "../yhes-actions" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
security-framework-sys = "=2.17.0"
core-foundation = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
