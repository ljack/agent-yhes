# Remote server. Use a certificate valid for the hostname clients connect to.
listen: "0.0.0.0:4222"
authorization {
  token: $YHES_BROKER_TOKEN
}
tls {
  cert_file: $YHES_NATS_CERT
  key_file: $YHES_NATS_KEY
  timeout: 2
}
jetstream {
  store_dir: $YHES_NATS_STORE
  max_memory_store: 64MB
  max_file_store: 1GB
}
